name: Free Overture 10000 public place coverage test
on:
  push:
    branches: [codex/free-overture-rome-pilot]
permissions:
  contents: read
concurrency:
  group: overture-public-benchmark-10000
  cancel-in-progress: true
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: europe-west
            cities: "rome paris london berlin"
          - shard: europe-other
            cities: "madrid barcelona lisbon amsterdam"
          - shard: europe-east
            cities: "vienna prague istanbul athens"
          - shard: asia-pacific
            cities: "tokyo seoul singapore sydney"
          - shard: americas
            cities: "new-york chicago toronto mexico-city"
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_overture_discovery_pilot.py' -v
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check --no-input duckdb==1.4.1
      - name: Generate 2000 public place geotags for four cities
        run: python scripts/generate-public-10000.py --cities ${{ matrix.cities }} --out public-2000.csv
      - name: Download real Overture release and match
        run: |
          python scripts/download-overture-rome.py public-2000.csv "${RUNNER_TEMP}/overture.geojsonseq"
          python scripts/overture-discovery-pilot.py \
            --sortie public-2000.csv \
            --source-data "${RUNNER_TEMP}/overture.geojsonseq" \
            --skip-download \
            --outdir "${RUNNER_TEMP}/results"
      - name: Print summary and all rows
        if: success()
        run: |
          cat "${RUNNER_TEMP}/results/summary.json"
          cat "${RUNNER_TEMP}/results/candidates.csv"
