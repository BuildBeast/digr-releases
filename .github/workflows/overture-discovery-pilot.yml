name: Free Overture 1000 public place coverage test

on:
  push:
    branches:
      - codex/free-overture-rome-pilot

permissions:
  contents: read

concurrency:
  group: overture-public-rome-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate matcher
        run: python -m unittest discover -s scripts -p 'test_overture_discovery_pilot.py' -v
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check --no-input duckdb==1.4.1
      - name: Generate independent public 1000-place fixture
        run: python scripts/generate-public-1000.py
      - name: Download actual Overture data and match 1000 public places
        run: |
          python scripts/download-overture-rome.py public-wikipedia-1000.csv "${RUNNER_TEMP}/overture-rome.geojsonseq"
          python scripts/overture-discovery-pilot.py \
            --sortie public-wikipedia-1000.csv \
            --source-data "${RUNNER_TEMP}/overture-rome.geojsonseq" \
            --skip-download \
            --outdir "${RUNNER_TEMP}/rome-report"
      - name: Print complete results
        if: success()
        run: |
          cat "${RUNNER_TEMP}/rome-report/summary.json"
          cat "${RUNNER_TEMP}/rome-report/candidates.csv"
