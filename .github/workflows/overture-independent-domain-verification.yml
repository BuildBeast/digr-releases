name: Independent official-domain verification, public test
on:
  push:
    branches: [codex/overture-official-verification]
permissions:
  contents: read
concurrency:
  group: overture-verify-proof
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check duckdb==1.4.1
      - name: Generate public places (first four cities)
        run: python scripts/generate-public-10000.py --cities rome paris london berlin --out public-2000.csv
      - name: Fetch Overture and produce candidates
        run: |
          python scripts/download-overture-rome.py public-2000.csv "${RUNNER_TEMP}/overture.geojsonseq"
          python scripts/overture-discovery-pilot.py --sortie public-2000.csv --source-data "${RUNNER_TEMP}/overture.geojsonseq" --skip-download --outdir "${RUNNER_TEMP}/output"
      - name: Independently corroborate candidate domains
        run: |
          python scripts/verify-official-website.py --candidates "${RUNNER_TEMP}/output/candidates.csv" --outdir "${RUNNER_TEMP}/output"
          cat "${RUNNER_TEMP}/output/verification-summary.json"
      - name: Save audit CSV (public reference places only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: overture-domain-corrob-2000
          path: |
            ${{ runner.temp }}/output/verified.csv
            ${{ runner.temp }}/output/verification-summary.json
          retention-days: 1
